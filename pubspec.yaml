name: flutter_riverpod_clean_architecture
description: "Expense Tracker App - Clean Architecture Base"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  hive: ^2.2.3
  flutter_secure_storage: ^10.0.0
  intl: ^0.20.2
  connectivity_plus: ^7.0.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.1
  in_app_review: ^2.0.9
  uuid: ^4.3.3
  synchronized: ^3.1.0
  local_auth: ^3.0.0
  riverpod_annotation: ^4.0.0
  fpdart: ^1.2.0
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0
  crypto: ^3.0.6
  path_provider: ^2.1.5
  flutter_tts: ^4.2.1
  workmanager: ^0.5.2
  grpc: ^4.0.1
  protobuf: ^3.1.0
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  flutter_gen_runner: ^5.10.0
  change_app_package_name: ^1.5.0
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.0.0
  custom_lint: ^0.8.1
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/en/
    - assets/images/es/
    - assets/images/fr/
    - assets/images/de/
    - assets/images/ja/
    - assets/images/bn/
    - assets/fonts/
